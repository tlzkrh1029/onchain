<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>onchain · 온체인 지표 모음</title>
  <meta name="description" content="공개 온체인 데이터로 재현한 비트코인 지표를 매일 갱신해 모아 둔 페이지입니다.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <nav class="top">
    <div class="wrap">
      <a class="brand" href="./">onchain</a>
      <span class="spacer"></span>
      <a class="repo" href="https://github.com/tlzkrh1029/onchain">GitHub</a>
    </div>
  </nav>

  <main class="wrap">
    <header class="hero">
      <h1>온체인 지표 모음</h1>
      <p class="lead">공개된 온체인 원시 데이터로 비트코인 지표를 직접 계산하고, 계산 원리와 함께 정리했습니다. 모든 지표는 GitHub Actions가 매일 자동으로 다시 계산합니다.</p>
    </header>

    <section aria-labelledby="list-h">
      <h2 id="list-h">지표</h2>
      <div class="ind-list">
        <a class="ind" href="aasi/" id="ind-aasi">
          <h3>AASI · 활성 주소 심리 지표</h3>
          <p>활성 주소 수와 가격의 28일 변화율을 비교해 단기 과열과 과매도를 판단합니다.</p>
          <div class="now" id="aasi-now">현재 값을 불러오는 중입니다.</div>
        </a>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <p>데이터: <a href="https://coinmetrics.io/">Coin Metrics</a> Community Data (<a href="https://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</a>).</p>
      <p>이 페이지는 정보 제공을 위한 것이며 투자 조언이 아닙니다.</p>
    </div>
  </footer>

  <script>
    (function () {
      var ZONE = { over: ["▲", "과열"], under: ["▼", "과매도"], in: ["●", "중립"] };
      var pct = function (v) { return (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v * 100).toFixed(1) + "%"; };
      fetch("data/aasi.json", { cache: "no-cache" })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var L = d.latest, box = document.getElementById("aasi-now");
          box.textContent = "";
          var tag = document.createElement("span");
          tag.className = "zone-tag " + L.zone;
          var ico = document.createElement("span");
          ico.className = "ico";
          ico.textContent = ZONE[L.zone][0];
          var lab = document.createElement("span");
          lab.textContent = ZONE[L.zone][1];
          tag.append(ico, lab);
          box.append(tag, document.createTextNode(
            "  ·  " + L.date + " 기준 가격 28일 변화율 " + pct(L.px_chg) + ", 밴드 " + pct(L.lower) + " ~ " + pct(L.upper)
          ));
        })
        .catch(function () {
          document.getElementById("aasi-now").textContent = "현재 값을 불러오지 못했습니다.";
        });
    })();
  </script>
</body>
</html>
